apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-to-lidersea-com
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lidersea-com.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lidersea-com.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- /* Only the configured ingress peer may reach the origin, and only on
    the application's unprivileged HTTP port. The peer identity is injected
    from values — the deployment-provider binding point — so the template
    stays provider-neutral by doctrine. It takes all three facts to name one
    peer: the peer namespace is shared, and the connectors in it publish the
    same app label and differ only by instance, so a selector without the
    instance line would admit every one of them. The schema requires the
    instance, so this selector cannot render unpinned. */}}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.peerNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.ingress.peerAppName }}
              app.kubernetes.io/instance: {{ .Values.ingress.peerInstance }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  # The site serves an embedded bundle and has no runtime dependency, so any
  # outbound connection is denied. The ratings collector is the origin's only
  # outbound capability and ships disabled, so egress is impossible rather than
  # merely unattempted; enabling it is a separate reviewed decision that adds an
  # exact allow-list, never a widening of this one.
  # The empty list below is NOT what denies. NetworkPolicySpec.Egress is
  # `json:"egress,omitempty"` upstream, so the API server drops this empty list
  # from the stored spec and the admitted object carries the deny through the
  # `- Egress` entry in policyTypes ALONE. That entry is the load-bearing line --
  # dropping it while leaving this empty list here silently restores full
  # outbound access.
  egress: []
