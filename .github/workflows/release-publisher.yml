name: Release publisher

# Publishes ONLY from an explicit semantic version tag. There is deliberately
# no manual dispatch, no skip flag, no force path, and no way to reassign an
# existing tag: security behaviors here have no off switch.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/snaraj/lidersea-com
  CHART: ghcr.io/snaraj/charts/lidersea-com

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified tools
        run: ./scripts/ci/install-tools.sh
      - name: Enforce the three-way version lock (tag == VERSION == chart)
        id: release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          IFS= read -r version < VERSION
          chart_version="$(awk '/^version:/{print $2; exit}' chart/Chart.yaml)"
          app_version="$(awk '/^appVersion:/{gsub(/"/,"",$2); print $2; exit}' chart/Chart.yaml)"
          test "${tag}" = "v${version}"
          test "${chart_version}" = "${version}"
          test "${app_version}" = "${version}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"
      - name: Refuse to reuse an existing image tag
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            printf 'immutable tag %s already exists; bump the version instead\n' \
              "${{ steps.release.outputs.tag }}" >&2
            exit 1
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish both production architectures
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Semantic version only: the commit SHA lives in labels, never as a
          # human-facing tag (package-page clarity is a product feature).
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.title=lidersea.com
            org.opencontainers.image.description=Go service embedding the built Svelte frontend for lidersea.com
            org.opencontainers.image.source=https://github.com/snaraj/lidersea.com
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign the immutable image digest
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Attach the BuildKit SLSA provenance as cosign attestations
        # Buildx (provenance: mode=max above) embeds one SLSA v1 provenance
        # statement per platform inside the pushed index. Read each predicate
        # back from the immutable digest just signed and attach it as a
        # keyless cosign attestation (slsaprovenance1) on that same digest,
        # so verifiers that require cosign-attached attestations — the
        # platform promotion ratchet, website-infrastructure#58 — can demand
        # them from this release onward. Same identity, permissions, and
        # no-skip discipline as the signing step: a missing or empty
        # predicate fails the release.
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          for platform in linux/amd64 linux/arm64; do
            predicate="${RUNNER_TEMP}/slsa-${platform//\//-}.json"
            docker buildx imagetools inspect "${IMAGE}@${digest}" \
              --format "{{ json (index .Provenance \"${platform}\").SLSA }}" \
              > "${predicate}"
            test -s "${predicate}"
            grep -q '"buildDefinition"' "${predicate}"
            cosign attest --yes --type slsaprovenance1 \
              --predicate "${predicate}" "${IMAGE}@${digest}"
          done
      - name: Refuse to reuse an existing chart version, then publish and sign the chart
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          if helm show chart "oci://${CHART%/lidersea-com}/lidersea-com" --version "${version}" >/dev/null 2>&1; then
            printf 'immutable chart version %s already exists; bump instead\n' "${version}" >&2
            exit 1
          fi
          helm package chart --version "${version}" --app-version "${version}" -d "${RUNNER_TEMP}"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          push_log="${RUNNER_TEMP}/chart-push.log"
          helm push "${RUNNER_TEMP}/lidersea-com-${version}.tgz" "oci://ghcr.io/snaraj/charts" 2>&1 | tee "${push_log}"
          chart_digest="$(awk '/^Digest:/{print $2}' "${push_log}")"
          test -n "${chart_digest}"
          cosign sign --yes "${CHART}@${chart_digest}"
          printf 'CHART_DIGEST=%s\n' "${chart_digest}" >> "${GITHUB_ENV}"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          {
            printf '## lidersea.com %s\n\n' "${tag}"
            printf 'Immutable artifacts (deploy by digest, never by tag):\n\n'
            printf '| Artifact | Reference |\n| --- | --- |\n'
            printf "| Image | \`%s@%s\` |\n" "${IMAGE}" "${{ steps.build.outputs.digest }}"
            printf "| Chart | \`%s@%s\` |\n" "${CHART}" "${CHART_DIGEST}"
            printf '\nSigned with keyless Cosign by this workflow identity; SBOM and SLSA provenance attached to the image, and the SLSA provenance is additionally attached as keyless cosign attestations (slsaprovenance1) on the image digest. See CHANGELOG.md for human-readable changes.\n'
          } > "${RUNNER_TEMP}/release-notes.md"
          gh release create "${tag}" --verify-tag \
            --title "lidersea.com ${tag}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
