apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidersea-com
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lidersea-com.labels" . | nindent 4 }}
  annotations:
    # Admission treats this reviewed readiness marker independently from normal
    # Kubernetes probe health; it remains false while release inputs are staged.
    platform.snaraj.dev/deployment-ready: {{ .Values.deploymentReady | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    # Swap-in-place, not surge: the namespace ResourceQuota (pods: 2,
    # limits.memory: 256Mi) is sized for exactly replicaCount pods at this
    # chart's own per-pod memory limit (128Mi x 2 = 256Mi), so a third pod
    # of any kind is unschedulable. maxSurge: 1 proved this live during the
    # v0.1.16 rollout: the controller scaled the OLD ReplicaSet back up to
    # 2 first (chasing the maxUnavailable: 0 availability floor), which
    # alone filled the quota, and the NEW ReplicaSet's pod was then
    # quota-rejected and the rollout wedged permanently. maxSurge: 0 with
    # maxUnavailable: 1 replaces one old pod with one new pod at a time —
    # 2 pods present throughout, never 3 — which is the only strategy that
    # converges within this budget.
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lidersea-com.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "lidersea-com.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: lidersea-com
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lidersea-com
          # Only a full index digest is accepted by the schema; the initial zero
          # digest is intentionally non-runnable until promotion updates it.
          {{- /* repository:tag@digest. The digest is what Kubernetes resolves and
          what cosign and admission verify; the tag is legibility only and is
          never a substitute for it. Both are required by the values schema, so
          a chart that dropped the digest cannot render. */}}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            # A bounded memory-backed /tmp satisfies libraries that expect a
            # scratch path without making the immutable root filesystem writable.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
