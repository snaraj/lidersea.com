# Lift mechanism for the scripts/ci gates.
#
# WHY THIS FILE EXISTS
#
# This repository is under active development. A gate that pins an exhaustive
# inventory — "exactly these steps", "exactly these callers" — breaks on every
# legitimate addition and teaches agents to re-record the inventory instead of
# thinking about the change. The gates that read this file therefore refuse
# NAMED DANGEROUS CONSTRUCTS and stay silent about everything else.
#
# When a refusal is nevertheless wrong for a specific, reviewed case, widening
# it must be CHEAP: one line here, in one PR, with a written reason. That is a
# normal part of active development, not a security event. It is deliberately
# not a release train, a code change, or a new abstraction.
#
# RULES FOR AN ENTRY
#
#   * One line, one entry, one reason. The reason is not optional — a gate
#     that reads an entry with a blank reason fails closed, because an entry
#     without a reason is not a decision, it is a hole.
#   * State WHY the construct is safe here, not what it is. "needed for the
#     build" is not a reason; "the upload is best-effort telemetry and no
#     later step reads it" is.
#   * An entry is scoped as tightly as the gate allows, so it lifts exactly
#     one case and cannot silently cover the next one.
#   * Delete an entry when the case that justified it is gone.
#
# Every failure message from both gates prints the exact line to add here.

# ---------------------------------------------------------------------------
# scripts/ci/test_subcommand_callers.py
#
# Every argparse subcommand `scripts/ci/release_contract.py` registers must
# have at least one caller outside the module. The gate fails on a subcommand
# with ZERO callers (dead code that still looks live) and on one whose only
# callers are tests (a suite exercising a command nothing invokes).
#
# Entry format — the subcommand name, exactly as registered:
#
#   "some-subcommand" = "why this command has no non-test caller today"
#
# Seeded empty on purpose: every one of the 33 registered
# subcommands has a workflow, script, or doc caller. `settings-receipt` is
# doc-only and needs no entry — an operator escape hatch invoked from
# docs/release-governance.md is a real caller, and the gate reports the tier
# so a reviewer can see which kind it is.
[subcommand_callers]

# ---------------------------------------------------------------------------
# scripts/ci/test_workflow_integrity.py
#
# Three refusals over .github/workflows: continue-on-error on a required-check
# job or step, a step-level env: that captures a pin, and a custom shell: on a
# gate step. There is deliberately NO step inventory — see the module docstring
# in scripts/ci/workflow_integrity.py for why one must never be added.
#
# Entry formats — the gate prints the exact key when it fails:
#
#   "<workflow>.yml::<job>::continue-on-error"            = "reason"
#   "<workflow>.yml::<job>::<step name>::continue-on-error" = "reason"
#   "<workflow>.yml::<job>::<step name>::shell"           = "reason"
#   "<workflow>.yml::<job>::<step name>::env::<VARIABLE>"  = "reason"
#
# Seeded empty on purpose: no workflow in this repository declares
# continue-on-error anywhere, declares a custom shell anywhere, or binds a
# pinned variable at step level. The seed records the measured baseline rather
# than reserving room for violations nobody has proposed.
#
# The suite refuses a STALE entry — one naming a construct no workflow declares
# today, whether the cause is a removed construct or a mistyped key — so no
# entry outlives the case that justified it. It does NOT bound how many entries
# this table holds, and it never asserts the table is empty: an empty-table pin
# would refuse the exact line the failure message tells an agent to add.
[workflow_integrity]

# ---------------------------------------------------------------------------
# scripts/ci/commit_identity.py
#
# Every commit a pull request proposes must be authored AND committed as the
# owner's noreply identity, and no commit message may carry a co-author
# trailer. Both rules sit on a surface `gitleaks` structurally cannot see: it
# scans blob content, while identities and messages are neither.
#
# Entry format — the commit SHA, full and lowercase:
#
#   "<40-lowercase-hex>" = "why this commit's identity or trailer is accepted"
#
# NAME THE COMMIT BY SHA, NEVER BY ADDRESS. Requirement 11 keeps personal data
# out of this repository; an allowlist keyed by address would copy a third
# party's contact detail into a tracked file, publishing it a second time
# somewhere it was not before. The suite refuses an "@" in a reason for the
# same reason.
#
# The five entries below are the repository's KNOWN historical exceptions,
# found by a security sweep on 2026-08-27 and recorded rather than erased.
# They are ancestors of `main`, permanently public, and predate this gate;
# history here is append-only (requirement 2), so no pull request can repair
# them and rewriting from the root is forbidden. Recording them is what lets
# the gate refuse anything NEW without lying about the past.
#
# These entries are NOT reached by the ordinary pull-request run, whose range
# starts at the PR base — they are load-bearing for any wider range, and the
# suite proves each names a real commit that really does violate a rule, so a
# seed for a clean commit would be reported rather than kept.
[commit_identity]
"696d9621f2a29ac21ca63274f5b91222ac7aa283" = "root commit; authored and committed under a personal identity before the noreply rule existed. Ancestor of main and unrewritable."
"8267007ddf84478a804e5f1170fe8e62c6c87047" = "onboarding squash carrying one co-author trailer; predates the no-trailer rule. Ancestor of main and unrewritable."
"d9d17c1c949aebcebe8b8e5221df3fdb9a328083" = "hardening squash carrying two co-author trailers; predates the no-trailer rule. Ancestor of main and unrewritable."
"38f4b0956dd5ad03fa0e4d83c2d1442ca736aeaa" = "SBOM squash carrying one co-author trailer; predates the no-trailer rule. Ancestor of main and unrewritable."
"73c275c011d39c0aa376a597a8f886a2fd598a23" = "GHCR-tag squash carrying one co-author trailer; predates the no-trailer rule. Ancestor of main and unrewritable."
