apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-to-lidersea-com
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lidersea-com.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lidersea-com.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- /* Only the configured ingress peer may reach the origin, and only on
    the application's unprivileged HTTP port. The peer identity is injected
    from values — the deployment-provider binding point — so the template
    stays provider-neutral by doctrine. */}}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.peerNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.ingress.peerAppName }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  # The site has no runtime dependency, so any outbound connection is denied.
  egress: []
